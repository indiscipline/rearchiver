name: Build and Release Nim Program

on:
  push:
    tags:
      - 'v*.*.*'

env:
  APP_NAME: rearchiver
  # Release binaries use the latest stable Nim. The supported minimum
  # remains Nim 2.0 and is declared in the .nimble metadata.
  NIM_VERSION: stable

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: rearchiver_linux
          - os: windows-latest
            asset: rearchiver_win64.exe
          # macos-latest now tracks arm64; keep the release asset x86_64.
          - os: macos-15-intel
            asset: rearchiver_macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Nim
        if: runner.os != 'macOS'
        uses: jiro4989/setup-nim-action@v2.3.1
        with:
          nim-version: ${{ env.NIM_VERSION }}

      - name: Setup Nim (macOS prebuilt)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ env.NIM_VERSION }}"
          if [ "$version" = stable ]; then
            version="$(curl -fsSL https://nim-lang.org/channels/stable)"
          fi
          archive="${RUNNER_TEMP}/nim.tar.xz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://nim-lang.org/download/nim-${version}-macosx_x64.tar.xz"
          tar -xf "$archive" -C "$RUNNER_TEMP"
          echo "${RUNNER_TEMP}/nim-${version}/bin" >> "$GITHUB_PATH"
          echo "${HOME}/.nimble/bin" >> "$GITHUB_PATH"

      - name: Build
        run: nimble build -y -d:release

      - name: Prepare binary
        shell: bash
        run: |
          mkdir -p artifacts
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "${APP_NAME}.exe" "artifacts/${{ matrix.asset }}"
          else
            cp "${APP_NAME}" "artifacts/${{ matrix.asset }}"
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: artifacts/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8.0.2
        with:
          path: ./dist
          merge-multiple: true

      - name: List binaries
        run: ls -lR ./dist

      - name: Create release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ./dist/*
